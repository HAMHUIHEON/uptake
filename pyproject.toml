[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "misreading-forecaster"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai", "pytest", "truststore"]

[project.scripts]
forecast = "forecaster.cli:main"
forecast-bench = "forecaster.cli:bench_main"
uptake-transcribe = "forecaster.transcribe:main"
uptake-moves = "forecaster.moves:main"
uptake-eval-moves = "forecaster.eval_moves:main"
uptake-board = "forecaster.board:main"
uptake-manifest = "forecaster.batch:manifest_main"
uptake-batch = "forecaster.batch:batch_main"
uptake-analyze = "forecaster.analyze:main"
uptake-calibrate = "forecaster.calibrate:main"
uptake-predict = "forecaster.predict:main"
uptake-transfer = "forecaster.predict:transfer_main"
uptake-outcome = "forecaster.outcome:main"
uptake-comment = "forecaster.commentary:main"
uptake-viewer = "forecaster.viewer:main"
uptake-viewer2 = "forecaster.viewer2:main"
uptake-stakes = "forecaster.stakes:main"
uptake-value = "forecaster.valuemodel:main"
uptake-rescore = "forecaster.rescore:main"
uptake-scale = "forecaster.scalecheck:main"
uptake-pairwise = "forecaster.pairwise:main"
uptake-audio-panel = "forecaster.audiopanel:main"

[tool.setuptools.packages.find]
include = ["forecaster"]
