[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "misreading-forecaster"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai", "pytest", "truststore"]

[project.scripts]
forecast = "forecaster.cli:main"
forecast-bench = "forecaster.cli:bench_main"

[tool.setuptools.packages.find]
include = ["forecaster"]
